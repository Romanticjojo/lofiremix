[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miaomi-dj-agent"
version = "0.1.0"
description = "Local, reproducible autonomous DJ planning and mixing with Mixxx integration"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "librosa>=0.11,<0.12",
  "soundfile>=0.13,<0.14", "mutagen>=1.47,<2", "platformdirs>=4,<5",
]

[project.optional-dependencies]
beat = ["beat-this==1.1.0", "torch==2.8.0", "torchaudio==2.8.0"]
midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]
stems = ["demucs==4.0.1", "torch==2.8.0", "torchaudio==2.8.0"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
dj-agent = "dj_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dj_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
link-mode = "copy"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
