<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Lofi House</title>
<style>
  :root{
    --bg:#0b0c10; --panel:#14161c; --panel2:#191c24; --line:#262a34;
    --text:#e8e6df; --dim:#8b8f9a;
    --amber:#d4a86a; --amber2:#e8c894;
    --v1:#d4a86a; --v1bg:rgba(212,168,106,.08); --v1line:rgba(212,168,106,.32);
    --v2:#7e9cc4; --v2bg:rgba(126,156,196,.08); --v2line:rgba(126,156,196,.32);
    --ok:#7fb98a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    min-height:100vh; padding-bottom:170px; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:18px 16px 30px}

  /* ===== 头部 ===== */
  header{padding:16px 0 18px}
  .eyebrow{font-size:10.5px;letter-spacing:.24em;color:var(--amber);text-transform:uppercase;margin-bottom:7px}
  h1{font-size:27px;font-weight:750;letter-spacing:-.015em}
  .sub{color:var(--dim);font-size:13px;margin-top:7px;line-height:1.65}

  /* ===== Tabs ===== */
  .tabs{
    display:flex;gap:8px;margin:20px 0 14px;position:sticky;top:0;z-index:30;
    background:linear-gradient(to bottom, var(--bg) 72%, rgba(11,12,16,0));
    padding:10px 0 12px;
  }
  .tab{
    flex:1;text-align:center;padding:11px 8px;border-radius:12px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);
    transition:all .18s ease;user-select:none;
  }
  .tab .tname{font-size:14.5px;font-weight:650;letter-spacing:.01em}
  .tab .tsub{font-size:10.5px;color:var(--dim);margin-top:3px;letter-spacing:.04em}
  .tab .tcount{font-size:10.5px;color:var(--dim);margin-top:2px}
  .tab.on-v1{background:var(--v1bg);border-color:var(--v1line)}
  .tab.on-v1 .tname{color:var(--v1)}
  .tab.on-v2{background:var(--v2bg);border-color:var(--v2line)}
  .tab.on-v2 .tname{color:var(--v2)}
  .room{display:none}
  .room.active{display:block;animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ===== 曲目卡 ===== */
  .track{
    background:var(--panel); border:1px solid var(--line); border-radius:13px;
    padding:11px 12px; margin-bottom:10px; display:flex; gap:12px; align-items:center;
    transition:border-color .18s, background .18s; position:relative; overflow:hidden;
    cursor:pointer;
  }
  .track:active{background:var(--panel2)}
  .track.playing{border-color:var(--room)}
  .track.playing{background:linear-gradient(90deg, var(--roombg), var(--panel) 55%)}
  .cover{width:54px;height:54px;border-radius:9px;object-fit:cover;flex:none;box-shadow:0 3px 10px rgba(0,0,0,.45)}
  .meta{flex:1;min-width:0}
  .name{font-size:14.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track.playing .name{color:var(--room)}
  .artist{color:var(--dim);font-size:11.5px;margin-top:2.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drow2{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
  .pill{font-size:9.5px;letter-spacing:.05em;border-radius:4px;padding:2px 6px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
  .pill.l{color:var(--ok);border:1px solid rgba(127,185,138,.3);background:rgba(127,185,138,.07)}
  .pill.n{color:var(--dim);border:1px solid var(--line);background:rgba(255,255,255,.03)}
  .pill.dur{color:var(--dim);border:none;background:none;padding:2px 0;font-variant-numeric:tabular-nums}
  .idx{
    flex:none;width:26px;text-align:center;color:var(--dim);
    font-size:12px;font-variant-numeric:tabular-nums;opacity:.75;
  }
  .track .go{
    flex:none;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);background:var(--panel2);color:var(--dim);
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .track .go svg{width:14px;height:14px;display:block}
  .track.playing .go{background:var(--room);color:#131313;border-color:var(--room)}
  .eq{display:none;gap:2.5px;align-items:flex-end;height:16px}
  .track.playing:not(.paused) .eq{display:flex}
  .track.playing.paused .go{font-size:11px}
  .eq i{width:2.5px;background:var(--room);border-radius:1px;min-height:2px;animation:eq 1s ease-in-out infinite alternate}
  .eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.1s}
  @keyframes eq{from{height:2.5px}to{height:15px}}

  /* ===== 底部说明 ===== */
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:13px 15px;margin-top:18px;
  }
  .stat .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .stat .row:last-child{border-bottom:none}
  .stat .k{color:var(--dim);flex:none}
  .stat .v{font-variant-numeric:tabular-nums;text-align:right;min-width:0;flex:1;overflow-wrap:anywhere;font-size:12px}

  /* ===== 吸底播放器 ===== */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(11,12,16,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    transform:translateZ(0);
  }
  .dock .inner{max-width:680px;margin:0 auto}
  .dockprog{position:absolute;top:-1px;left:0;right:0;height:2.5px;background:transparent}
  .dockprog i{display:block;height:100%;width:0%;background:var(--room,var(--amber));border-radius:0 2px 2px 0;transition:width .25s linear}
  .drow{display:flex;align-items:center;gap:11px}
  .disco{
    width:46px;height:46px;border-radius:50%;flex:none;position:relative;overflow:hidden;
    border:2px solid rgba(255,255,255,.12);box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .disco img{width:100%;height:100%;object-fit:cover;border-radius:50%}

  .disco.spin{animation:spin 7s linear infinite}
  .disco.spin.paused{animation-play-state:paused}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dmeta{flex:1;min-width:0}
  .dname{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dartist{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dbtn{
    width:38px;height:38px;border-radius:50%;flex:none;cursor:pointer;
    border:1px solid var(--room,var(--v1));background:var(--roombg,var(--v1bg));color:var(--room,var(--v1));
    font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  .dbtn svg{width:17px;height:17px;display:block}
  .dock[data-room="v1"] .dbtn{color:var(--amber2)}
  .dbtn.sm{width:32px;height:32px;border-color:transparent;background:transparent;color:#9a9fab;padding:0;transition:color .18s}
  .dbtn.sm:active{color:var(--text)}
  .dbtn.sm.on{color:var(--room,var(--amber))}
  .dbtn.sm svg{width:19px;height:19px;display:block}
  .dbtn.sm svg *{vector-effect:non-scaling-stroke}
  .dtime{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:66px;text-align:right}
  .dock[data-room="v2"]{--room:var(--v2);--roombg:rgba(126,156,196,.12)}
  .dock[data-room="v2"] .dbtn{color:var(--v2)}

  /* ===== 自动播放遮罩 ===== */
  .gate{position:fixed;inset:0;z-index:99;background:rgba(11,12,16,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
  .gate-in{text-align:center}
  .gate-btn{
    width:88px;height:88px;border-radius:50%;margin:0 auto 18px;
    border:1px solid rgba(212,168,106,.5);background:rgba(212,168,106,.13);color:var(--amber2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 12px 46px rgba(212,168,106,.16);
  }
  .gate-btn svg{width:32px;height:32px;display:block;margin-left:3px}
  .gate-t{color:var(--dim);font-size:13px;letter-spacing:.1em}
  .gate-t b{color:var(--amber2);font-weight:600}
</style>
</head>

const ROOMS = {v1:V1, v2:V2};
let room = 'v1';

const au = document.getElementById("au");
const gate = document.getElementById("gate");
const dock = document.getElementById("dock");
const dDisc = document.getElementById("dDisc");
let cur = null, lockUI = 0, started = false;
let shuffle = true;
let hist = [];
const fmt = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");

function trackOf(i){ return ROOMS[room][i]; }

function buildList(){
  const list = document.getElementById(room === 'v1' ? 'list1' : 'list2');
  const arr = ROOMS[room];
  arr.forEach((t, i) => {
    const el = document.createElement("div");
    el.className = "track";
    el.innerHTML = `
      <div class="idx">${i+1}</div>
      <img class="cover" src="${t.cover}" alt="" loading="lazy">
      <div class="meta">
        <div class="name">${t.name}</div>
        <div class="artist">${t.artist} · ${t.dur}</div>
        <div class="drow2">
          <span class="pill l">${t.lufs}</span>${t.note ? `<span class="pill n">${t.note}</span>` : ''}
        </div>
      </div>
      <div class="eq"><i></i><i></i><i></i><i></i></div>
      <div class="go"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>`;
    el.onclick = () => toggle(i);
    list.appendChild(el);
  });
  document.getElementById(room === 'v1' ? 'cnt1' : 'cnt2').textContent = arr.length + ' 首';
}
buildList();
document.getElementById("stCount").textContent = (V1.length + V2.length) + ' 首 (v1 ' + V1.length + ' + v2 ' + V2.length + ')';

function switchRoom(r){
  if (room === r) return;
  room = r;
  document.getElementById("tab1").style.display = '';
  document.getElementById("tab2").style.display = '';
  document.getElementById("tab1").classList.toggle("on-v1", r === 'v1');
  document.getElementById("tab2").classList.toggle("on-v2", r === 'v2');
  document.getElementById("room1").classList.toggle("active", r === 'v1');
  document.getElementById("room2").classList.toggle("active", r === 'v2');
  if (!document.getElementById(r === 'v1' ? 'list1' : 'list2').children.length) buildList();
  // 当前播放若是另一房的歌, dock 主题切到当前房间色
  syncAll();
}
document.getElementById("tab1").style.display = '';
document.getElementById("tab2").style.display = '';

function loadTrack(r, i, autoplay){
  room = r;
  const t = ROOMS[r][i];
  if (room !== (cur === null ? room : curRoom)) { /* noop */ }
  try{au.pause()}catch(e){}
  au.removeAttribute("src"); try{au.load()}catch(e){}
  au.src = t.src;
  try{au.load()}catch(e){}
  hist.push({r, i}); if (hist.length > 300) hist.shift();
  cur = i; curRoom = r; lockUI = Date.now() + 2500;
  syncAll();
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.name, artist: t.artist.replace(" · lofi remix",""),
        album: r === 'v1' ? "Lofi House · 经典黑胶房" : "Lofi House · 深夜助眠房",
        artwork: [{src: location.origin + t.cover, sizes: "512x512"}]
      });
    } catch(e) {}
  }
  const go = () => { if (autoplay) au.play().catch(()=>showGate()); };
  if (au.readyState >= 3) go();
  else au.addEventListener("canplay", go, {once:true});
}
let curRoom = 'v1';

function nextIdx(){
  const arr = ROOMS[room], from = cur || 0;
  if (!shuffle) return (from + 1) % arr.length;
  if (arr.length < 2) return 0;
  let n;
  do { n = Math.floor(Math.random() * arr.length); } while (n === from);
  return n;
}
function next(){ loadTrack(room, cur === null ? Math.floor(Math.random()*ROOMS[room].length) : nextIdx(), true); }
function prev(){
  hist.pop();
  const p = hist.pop();
  if (p) loadTrack(p.r, p.i, true);
  else { const arr = ROOMS[room]; loadTrack(room, (cur - 1 + arr.length) % arr.length, true); }
}
function toggle(i){
  if (curRoom === room && cur === i && !au.paused) { au.pause(); syncAll(); return; }
  if (curRoom === room && cur === i && au.paused) { au.play().catch(()=>showGate()); syncAll(); return; }
  loadTrack(room, i, true);
}

au.addEventListener("ended", () => { if (started) next(); });
au.addEventListener("play", () => { started = true; hideGate(); syncAll(); });
au.addEventListener("pause", syncAll);
au.addEventListener("timeupdate", () => {
  if (Date.now() < lockUI) return;
  const d = au.duration || 0;
  document.getElementById("dBar").style.width = (d ? au.currentTime / d * 100 : 0) + "%";
  const t = cur !== null ? ROOMS[curRoom][cur] : null;
  document.getElementById("dTime").textContent = fmt(au.currentTime) + " / " + (d ? fmt(d) : (t ? t.dur : "0:00"));
});
document.getElementById("dProg") && null;

if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("nexttrack", next);
    navigator.mediaSession.setActionHandler("previoustrack", prev);
    navigator.mediaSession.setActionHandler("play",  () => au.play().catch(()=>{}));
    navigator.mediaSession.setActionHandler("pause", () => au.pause());
  } catch(e) {}
}

const showGate = () => { gate.style.display = "flex"; };
const hideGate = () => { gate.style.display = "none"; };
document.getElementById("dBtn").onclick = () => {
  if (cur === null) { next(); return; }
  if (au.paused) au.play().catch(()=>showGate()); else au.pause();
};
document.getElementById("dNext").onclick = next;
document.getElementById("dPrev").onclick = prev;
const dShuf = document.getElementById("dShuf");
const ICON_SHUF_ON  = '<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/>';
const ICON_SHUF_OFF = '<path d="M4 12h13"/><path d="m14 7 5 5-5 5"/><path d="M4 7h5"/><path d="M4 17h5"/>';
const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/>';
function syncShuf(){ dShuf.classList.toggle("on", shuffle); dShuf.querySelector("svg").innerHTML = shuffle ? ICON_SHUF_ON : ICON_SHUF_OFF; }
dShuf.onclick = () => { shuffle = !shuffle; syncShuf(); };
syncShuf();
document.getElementById("gateBtn").onclick = (e) => { e.stopPropagation(); hideGate(); if (cur !== null && au.paused) au.play().catch(()=>{}); };
gate.onclick = () => { hideGate(); if (cur !== null && au.paused) au.play().catch(()=>{}); };

function syncAll(){
  ["v1","v2"].forEach(r => {
    const listEl = document.getElementById(r === 'v1' ? 'list1' : 'list2');
    [...listEl.children].forEach((el, i) => {
      const isCur = curRoom === r && cur === i;
      el.classList.toggle("playing", isCur);
      el.classList.toggle("paused", isCur && au.paused);
      el.querySelector(".go svg").innerHTML = isCur ? (au.paused ? ICON_PLAY : ICON_PAUSE) : ICON_PLAY;
    });
  });
  if (cur !== null){
    dock.style.display = "block";
    dock.dataset.room = curRoom;
    const t = ROOMS[curRoom][cur];
    document.getElementById("dCover").src = t.cover;
    document.getElementById("dName").textContent = t.name;
    document.getElementById("dArtist").textContent = (curRoom === 'v1' ? '黑胶房 · ' : '助眠房 · ') + t.artist;
    document.getElementById("dBtnIcon").innerHTML = au.paused ? ICON_PLAY : ICON_PAUSE;
    dDisc.classList.toggle("spin", !au.paused);
    dDisc.classList.toggle("paused", au.paused);
  }
}

// 自动播放: 进页随机放一首 v1
loadTrack('v1', Math.floor(Math.random() * V1.length), true);
function wechatKick(){ if (!started && au.paused) au.play().then(()=>{}).catch(()=>{}); }
if (typeof WeixinJSBridge === "undefined") {
  document.addEventListener("WeixinJSBridgeReady", wechatKick, false);
} else { wechatKick(); }
document.addEventListener("touchstart", function onceKick(){
  if (!started && cur !== null && au.paused) au.play().catch(()=>{});
}, {passive:true});
</script>
</body>
